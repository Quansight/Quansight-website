<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">benchx components</title>
  <desc id="d">The bx workbench CLI sends work orders to the runner: bx bench sends one, and bx compare sends one per side per round, alternating between the sides, then asks the comparator to compare the results. The runner drives harness adapters (pyperf, Google Benchmark, and asv-format suites timed with pyperf) and emits result documents in the shared result schema. Results are ingested into the result store (store.jsonl by default, or store.parquet), which the comparator reads to decide whether each change is bigger than the noise, giving verdicts such as improved, regressed, no change detected, or indeterminate.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- Workbench CLI -->
  <rect x="40" y="20" width="800" height="62" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="440" y="47" text-anchor="middle" font-size="17" font-weight="600" fill="#1e1b4b">Local workbench CLI: bx</text>
  <text x="440" y="68" text-anchor="middle" font-size="13" fill="#3730a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bx bench · bx compare</text>

  <!-- bx -> runner, bx -> comparator -->
  <line x1="120" y1="82" x2="120" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="128" y="102" font-size="12" fill="#475569"><tspan font-weight="600">bx bench</tspan>: one work order</text>
  <text x="128" y="118" font-size="12" fill="#475569"><tspan font-weight="600">bx compare</tspan>: one per side per round,</text>
  <text x="128" y="134" font-size="12" fill="#475569">sides alternating</text>
  <line x1="755" y1="82" x2="755" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="747" y="110" text-anchor="end" font-size="12" fill="#475569"><tspan font-weight="600">bx compare</tspan> only,</text>
  <text x="747" y="126" text-anchor="end" font-size="12" fill="#475569">after all rounds</text>

  <!-- Runner -->
  <rect x="40" y="150" width="160" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Runner</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#475569">runs each case,</text>
  <text x="120" y="216" text-anchor="middle" font-size="12" fill="#475569">records provenance</text>

  <!-- Result documents (data) -->
  <rect x="250" y="150" width="170" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="335" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#451a03">Results</text>
  <text x="335" y="200" text-anchor="middle" font-size="12" fill="#78350f">shared result schema</text>
  <text x="335" y="216" text-anchor="middle" font-size="12" fill="#78350f">(units, environment)</text>

  <!-- Store -->
  <rect x="470" y="150" width="160" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Result store</text>
  <text x="550" y="200" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">store.jsonl</text>
  <text x="550" y="216" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">or store.parquet</text>

  <!-- Comparator -->
  <rect x="680" y="150" width="160" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="760" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Comparator</text>
  <text x="760" y="200" text-anchor="middle" font-size="12" fill="#475569">is the change bigger</text>
  <text x="760" y="216" text-anchor="middle" font-size="12" fill="#475569">than the noise?</text>

  <!-- pipeline arrows -->
  <line x1="200" y1="190" x2="246" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="190" x2="466" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="443" y="180" text-anchor="middle" font-size="12" fill="#475569">ingest</text>
  <line x1="630" y1="190" x2="676" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="653" y="180" text-anchor="middle" font-size="12" fill="#475569">read</text>

  <!-- runner <-> adapters -->
  <line x1="120" y1="234" x2="120" y2="286" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Harness adapters -->
  <rect x="40" y="290" width="380" height="100" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="56" y="313" font-size="15" font-weight="600" fill="#052e16">Harness adapters</text>
  <text x="56" y="332" font-size="12" fill="#166534">drive the harness, translate its output</text>
  <rect x="56" y="342" width="80" height="36" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="96" y="365" text-anchor="middle" font-size="13" fill="#052e16">pyperf</text>
  <rect x="144" y="342" width="148" height="36" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="218" y="365" text-anchor="middle" font-size="13" fill="#052e16">Google Benchmark</text>
  <rect x="300" y="342" width="104" height="36" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="352" y="365" text-anchor="middle" font-size="13" fill="#052e16">asv suites</text>

  <!-- comparator -> verdict -->
  <line x1="760" y1="230" x2="760" y2="286" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="290" width="280" height="100" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="700" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#500724">Verdict per benchmark</text>
  <text x="700" y="347" text-anchor="middle" font-size="12" fill="#831843">e.g. improved · regressed ·</text>
  <text x="700" y="366" text-anchor="middle" font-size="12" fill="#831843">no change detected · indeterminate</text>
</svg>
