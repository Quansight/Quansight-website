      - Jaime Rodríguez-Guerra implemented [the ability to run a benchmark comparison between a PR and the main branch](https://labs.quansight.org/blog/2021/08/github-actions-benchmarks/).
      - Tania Allard was involved in project management and coordination with the DevOps team (John, Vinicius and Jaime).
