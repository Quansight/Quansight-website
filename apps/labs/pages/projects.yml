  - title: stdlib
    image: /images/page-assets/stdlib-symbol.svg
    imageAlt: stdlib Logo
    link: https://github.com/stdlib-js/stdlib
    linkText: Go to the project's page
    shortDescription: A fundamental tenet of stdlib is decomposability. Every bit of functionality needs
      to be independently consumable and composable. Accordingly, one of our big initiatives has been
      the atomization of stdlib, which has really driven adoption of the project by meeting web developers
      where they are based on their needs and existing workflows and has allowed us to more fully embrace
      the web platform as a whole.
    longDescription: |-
      ### Contributions to the Project

      - Updated website with improved accessibility and support for search and offline access.
      - Complex number support in ndarray functions.
      - Cache oblivious loop generation for ndarray unary functions.
      - Library decomposition into atomized packages.
      - GitHub workflow automation and orchestration for managing >3000 organization repositories.
      - [Quansight Open Source Directions (November, 2019)](https://www.youtube.com/watch?v=SYbp_dr8WWo)

      ### Quansight Contributors

      - [Athan Reines](https://github.com/kgryte)
  - title: Cython
    image: /images/page-assets/cython-symbol.svg
    imageAlt: Cython Logo
    link: https://github.com/cython/cython
    linkText: Go to the project's page
    shortDescription: Quansight Labs views the Cython project as critical infrastructure, and is working
      to support it more generously.
    longDescription: |-
      ### Contributions to the Project

      [Cython](https://cython.readthedocs.io/en/stable/index.html) is a core infrastructure project used by many other projects. As such, it is hard to garner attention since it is hidden away underneath more visible projects.

      - Ralf has contributed to raising the profile of the project and helped write grant proposals for direct funding.

      As a mature project, much of the work is in upgrading for changed and new compilers and platforms, new Python versions, and new Python features.

      - Matti has been pushing to get [HPy](https://hpyproject.org/) support into Cython, which is a new way to interface C to Python. He has also helped to maintain and improve CI and documentation builds, and to enable [PyPy](https://pypy.org/) support for Cython.

      ### Quansight Contributors

      - [Ralf Gommers](https://github.com/rgommers)
      - [Matti Picus](https://github.com/mattip)
  - title: scikit-image
    image: /images/page-assets/scikit-image-symbol.png
    imageAlt: scikit-image Logo
    link: https://github.com/scikit-image/scikit-image
    linkText: Go to the project's page
    shortDescription: The cross-project expertise at Quansight has facilitated a collaboration with SciPy
      and scikit-learn maintainers on consistent user experience for handling array backends. A few exciting
      things are work-in-progress, the Array API and array dispatching for example, which will enable
      running scikit-image on GPUs, or use Dask for large data.
    longDescription: |-
      ### Contributions to the Project

