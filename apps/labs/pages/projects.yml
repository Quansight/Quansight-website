  - title: SymPy
    image: /images/page-assets/sympy-icon.svg
    imageAlt: SymPy Logo
    link: https://github.com/sympy/sympy
    linkText: Go to the project’s page
    shortDescription: SymPy is quite large with over 1,000 public functions and methods, but the documentation
      for parts of SymPy is often lacking. Particularly lacking are high-level user guides and tutorials.
      Aaron's work is writing new documentation, with a focus on these high-level things.
    longDescription: |-
      ### Contributions to the Project

      - Aaron has done general maintance up to 2021
      - Since September 2021, Aaron is improving SymPy's documentation [supported by CZI EOSS cycle 4 grant](https://groups.google.com/g/sympy/c/vYsavewGj1w/m/CQKTSznPAgAJ), with [community guidance](https://www.sympy.org/sympy-docs-survey/2021-docs-survey.html).

