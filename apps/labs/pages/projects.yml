  - title: NumPy
    image: /images/page-assets/numpy-icon.svg
    imageAlt: NumPy logo
    link: https://github.com/numpy/numpy
    linkText: Go to the project’s page
    shortDescription: The Array API means other projects can adopt the NumPy API. For example, NumPy doesn’t
      offer GPU support, but other projects do. The new Array API we are collaboratively introducing,
      allows users to use the NumPy API, with a middle layer — the new Array API, and then any other backend
      you might like.
    longDescription: |-
      ### Contributions to the Project

      - Pearu Peterson, has done significant contributions to NumPy and the scientific Python ecosystem over the last two decades.
      - Matti Picus has worked on several performance improvements for NumPy, such as implementing a [configurable allocator](https://numpy.org/devdocs/reference/c-api/data_memory.html) for NumPy, reviewing and documenting work on the implementation of SIMD optimizations, and reviewing and merging the recent DType refactoring ([NEP 42](https://numpy.org/neps/nep-0042-new-dtypes.html)). Matti also works on CI maintenance, integrating new OpenBLAS versions, and pushing the move to cibuildwheel.
      - Ralf Gommers has acted as a release manager for NumPy in the past, and is now focusing on code reviews, governance, fundraising (e.g., Tidelift connection and support for other [grants](https://labs.quansight.org/blog/2019/11/numpy-openblas-czi-grant/) and funding opportunities) as well as general project management. Ralf is also the chair of the [Consortium for Python Data API Standards](https://data-apis.org/).
      - Melissa Weber Mendonça has helped support work on [f2py and documentation](https://labs.quansight.org/blog/2020/11/a-second-czi-grant-for-numpy-and-openblas/) and is now focusing on community and general maintenance. Melissa is also leading a joint-project with Matplotlib, SciPy and Pandas to advance an [inclusive Culture in the Scientific Python Ecosystem](https://chanzuckerberg.com/eoss/proposals/advancing-an-inclusive-culture-in-the-scientific-python-ecosystem/).
      - Rohit Goswami works on f2py and documentation, including the effort to bring modern Fortran features to f2py.
      - Aaron Meurer works on the implementation of [the Array API](https://numpy.org/neps/nep-0047-array-api-standard.html), and has also collaborated on adding hypothesis testing capabilities to NumPy.
      - Gagandeep Singh has worked on several performance improvements such as vectorizing the QR decomposition and adding control over copy modes in array creation (related to the Array API standards implementation).
      - Hameer Abbasi has done work related to interoperability, including implementing the DLPack Array API protocols for ndarray.
      - Mars Lee has done frontend design and accessibility work for our home page and documentation, and is also working on the NumPy user survey.
      - Matthew Barber has worked on implementing [hypothesis testing support](https://labs.quansight.org/blog/2021/10/hypothesis-array-api/) for NumPy and the Array API.

      ### Quansight Contributors

      - [Aaron Meurer](https://github.com/asmeurer)
      - [Gagandeep Singh](https://github.com/czgdp1807)
      - [Hameer Abbasi](https://github.com/hameerabbasi), alumni
      - [Mars Lee](https://github.com/MarsBarLee)
      - [Matthew Barber](https://github.com/Honno), previous intern and now developer
      - [Matti Picus](https://github.com/mattip), member of the NumPy steering council and general maintainer
      - [Melissa Weber Mendonça](https://github.com/melissawm), member of the NumPy steering council and general maintainer, leading the documentation team
      - [Pearu Peterson](https://github.com/pearu), author and maintainer of f2py
      - [Ralf Gommers](https://github.com/rgommers), a member of the NumPy steering council and general maintainer
      - [Rohit Goswami](https://github.com/HaoZeke)
      - [Travis Oliphant](https://github.com/teoliphant), author of NumPy and emeritus maintainer
  - title: conda-forge
    image: /images/page-assets/conda-forge-icon.svg
    imageAlt: conda-forge logo
    link: https://github.com/conda-forge
    linkText: Go to the project’s page
    shortDescription: Working on conda-forge is like gardening. Gardens need constant care. If you don’t
      keep the maintenance work on a garden, it starts to grow wildly and becomes less pretty, eventually
      some plants might wither. Similarly, with conda-forge, we provide support for API/ABI compatibility,
      supporting volunteers, reviewing new submissions for packages, and so on.
    longDescription: |-
      ### Contributions to the Project

      - Mahe Iram Khan [shared her contributions to Grayskull](https://labs.quansight.org/blog/2022/01/conda-grayskull-packaging/), the automatic conda-forge recipe generator
      - Quansight silver-sponsored Packaging-Con (organized by core members of conda-forge)
      - Quansight supports conda-forge with developer time (Jaime Rodríguez-Guerra contributes 4h a week)
      - Quansight supports conda-forge with CI infrastructure (ongoing GPU server deployment)
      - Quansight is an officially recognized ["Service Provider"](https://conda-forge.org/docs/contracting/00_intro.html)

      ### Quansight Contributors

      - [Anthony Scopatz](https://www.github.com/scopatz) core member and one of the main pillars of the organization for a number of years
      - [Dharhas Pothina](https://www.github.com/dharhas) community member since inception, led efforts to improve geospatial packaging
      - [Gonzalo Peña-Castellanos](https://www.github.com/goanpeca) staged-recipes reviewer since 2021
      - [Jaime Rodríguez-Guerra](https://www.github.com/jaimergp) core member since August, 2021
      - [Mahe Iram Khan](https://www.github.com/ForgottenProgramme) her 2021 internship contributed to Grayskull
      - [Matti Picus](https://www.github.com/mattip) pypy help team member
      - [Vinicius D. Cerutti](https://www.github.com/viniciusdc) core member since March, 2021 bots team

      ### Quansighters maintaining 20 or more feedstocks:

      [Aaron Meurer](https://www.github.com/asmeurer), [Anthony Scopatz](https://www.github.com/scopatz), [Carlos Cordoba](https://www.github.com/ccordoba12), [Edgar Andrés Margffoy Tuay](https://www.github.com/andfoy), [Gonzalo Peña-Castellanos](https://www.github.com/goanpeca), [Gregory Lee](https://www.github.com/grlee77), [Ivan Ogasawara](https://www.github.com/xmnlab), [Jaime Rodríguez-Guerra](https://www.github.com/jaimergp)

      ### Quansighters maintaining 1-20 feedstocks:

      [Andrew Fulton](https://www.github.com/andrewfulton9), [Anirrudh Krishnan](https://www.github.com/anirrudh), [Amit Kumar](https://www.github.com/aktech), [Christopher Ostrouchov](https://www.github.com/costrouc), [Dan Lester](https://www.github.com/danlester), [Daniel Althviz Moré](https://www.github.com/dalthviz), [Dharhas Pothina](https://www.github.com/dharhas), [Dillon Roach](https://www.github.com/dillonroach), [Eskild Eriksen](https://www.github.com/iameskild), [Filipe Laíns](https://www.github.com/FFY00), [Guilherme Leobas](https://www.github.com/guilhermeleobas), [Ilan Schnell](https://www.github.com/ilanschnell), [Ivan Yashchuk](https://www.github.com/IvanYashchuk), [Marc Garcia](https://www.github.com/datapythonista)[Matthias Bussonnier](https://www.github.com/Carreau), [Matti Picus](https://www.github.com/mattip), [Melissa Weber Mendonça](https://www.github.com/melissawm), [Pamphile Roy](https://www.github.com/tupui), [Pearu Peterson](https://www.github.com/pearu)[Philip Meier](https://www.github.com/pmeier), [Ralf Gommers](https://www.github.com/www.github.com/rgommers), [Stephannie Jimenez Gacha](https://www.github.com/steff456), [Vinicius D. Cerutti](https://www.github.com/viniciusdc)
  - title: SciPy
    image: /images/page-assets/scipy-icon.svg
    imageAlt: SciPy Logo
    link: https://github.com/scipy/scipy
    linkText: Go to the project’s page
    shortDescription: SciPy has been at the forefront of Quansight’s work. Five Quansighters are maintainers
      and seven others are contributors supporting the project.
    longDescription: |-
      ### Contributions to the Project

      - [Ensure public API of SciPy is well-defined, clean up everything else](https://github.com/scipy/scipy/issues/14360)
      - Ivan Yashchuk is the project lead for the [standard API project](https://labs.quansight.org/blog/2021/11/pydata-extensibility-vision), which aims to generalize SciPy for other array types
      - [Advancing an inclusive culture in the scientific Python ecosystem](https://figshare.com/articles/online_resource/Advancing_an_inclusive_culture_in_the_scientific_Python_ecosystem/16548063): A joint grant with NumPy, Matplotlib and Pandas that is leading to community and newcomers meetings, & soon much more
      - Greg Lee made significant improvements to scipy.ndimage - the most prominent one is [making extension modes consistent across ndimage](https://labs.quansight.org/blog/2021/01/scipy-ndimage-interpolation/) - and he is the main maintainer of this module.
      - Peter Bell: maintains `scipy.fft` and implemented [a new framework for distance metrics in ](https://github.com/scipy/scipy/pull/13907)`scipy.spatial.distance`
      - Pamphile Roy, who joined Quansight in January 2022, is a general SciPy maintainer, and the author/maintainer of `scipy.stats.qmc`.
      - Ralf Gommers is a general SciPy maintainer. He takes care of a lot of code reviews, governance, fundraising (e.g., Tidelift connection), is the NumFOCUS representative (for finances), etc. He has been leading the work on [moving SciPy to the Meson build system](https://labs.quansight.org/blog/2021/07/moving-scipy-to-meson/) and (with others) working on [interoperability with other array libraries](https://labs.quansight.org/blog/2021/11/pydata-extensibility-vision/).
      - Tirth Patel did some maintenance and added new features for scipy.stats on the side while interning at Quansight (though his main focus lies elsewhere)
      - Gagandeep Singh moved C code away from deprecated NumPy APIs. He also implemented new algorithms during the past year: [Dinic's algorithm for maximum flow](https://github.com/scipy/scipy/pull/14358) and [DIRECT solver for ](https://github.com/scipy/scipy/pull/14300)`scipy.optimize`
      - Tania Allard implemented [Gitpod support for SciPy](http://scipy.github.io/devdocs/dev/contributor/quickstart_gitpod.html)
      - Matti Picus helps with PyPy and wheel build issues
      - Melissa Mendonca is organizing the SciPy community meetings
      - Anirudh Dagar worked on an experimental project [to accept PyTorch tensors in SciPy code](https://labs.quansight.org/blog/2021/10/array-libraries-interoperability/). He also contributed to some maintenance work on the project.
      - Harsh Mishra worked on [CI improvements and Meson support](https://labs.quansight.org/blog/2021/10/re-engineering-cicd-pipelines-for-scipy/)

      ### Quansight Contributors

      - [Anirudh Dagar](https://github.com/AnirudhDagar), former intern at Quansight
      - [Evgeni Burovski](https://github.com/ev-br), maintainer
      - [Gagandeep Singh](https://github.com/czgdp1807)
      - [Gregory Lee](https://github.com/grlee77), maintainer
      - [Harsh Mishra](https://github.com/HarshCasper), intern at Quansight
      - [Ivan Yashchuk](https://github.com/IvanYashchuk)
      - [Matti Picus](https://github.com/mattip)
      - [Melissa Weber Mendonça](https://github.com/melissawm)
      - [Pamphile Roy](https://github.com/tupui), maintainer
      - [Peter Bell](https://github.com/peterbell10), maintainer
      - [Ralf Gommers](https://github.com/rgommers), maintainer
      - [Tania Allard](https://github.com/trallard)
      - [Tirth Patel](https://github.com/tirthasheshpatel/), maintainer, intern at Quansight
  - title: scikit-learn
    image: /images/page-assets/scikit-learn-symbol.svg
    imageAlt: scikit-learn Logo
    link: https://github.com/scikit-learn/scikit-learn
    linkText: Go to the project’s page
    shortDescription: 'Backlog reducing is useful for several reasons. From the maintainer''s side: it
      helps maintainers maintain, focus on bigger items, and reduces their cognitive load. From the community''s
      side: a lot of scikit-learn''s backlog consist of features and bug fixes that the community has
      been waiting for. Doing triage and backlog reduction is essential and valuable work.'
    longDescription: |-
      ### Contributions to the Project

      - Thomas led the development of [the feature name API](https://scikit-learn.org/stable/auto_examples/release_highlights/plot_release_highlights_1_0_0.html#feature-names-support) in version 1.0 and introduced the API to all transformers in version 1.1. The feature name API paves the way for more integration with Pandas in scikit-learn.
      - Thomas pushes for advancements in encoding categorical data, such as native support for missing values in encoders and infrequent category support in the one-hot-encoder.
      - Thomas's effort supports scikit-learn's contributors, which means reviewing changes and giving feedback.
      - Impactful PR's Thomas has reviewed:
      - With Meekail joining the team, the team [is starting to merge or close more PRs than open them](https://thomasjpfan.github.io/sklearn-repo-status/).

      ### Quansight Contributors

      - [Meekail Zain](https://www.github.com/micky774), since January 2022
      - [Thomas J. Fan](https://www.github.com/thomasjpfan), since May 2021
  - title: JupyterLab
    image: /images/page-assets/jupyterlab-icon.svg
    imageAlt: JupyterLab logo
    link: https://github.com/jupyterlab/jupyterlab
    linkText: Go to the project’s page
    shortDescription: Our Quansight Jovyans are leading the Jupyter accessibility meetings. It is the
      longest commitment the project had to accessibility, and the largest number of people gathered to
      collaborate on this topic so far. The work has encouraged more accessibility reviews in the contributing
      process.
    longDescription: |-
      ### Contributions to the Project

      - Internationalization support and translation of the infrastructure and certain language contributions.
      - We were part of the team that initiated and supports [JupyterLab performance testing](https://github.com/jupyterlab/benchmarks) and related performance-focused changes in the main repository, especially for long notebooks.
      - The addition of side-by-side notebook rendering.
      - We took part in a collaborative effort to set up [JupyterLab real time collaboration](https://blog.jupyter.org/how-we-made-jupyter-notebooks-collaborative-with-yjs-b8dff6a9d8af).
      - Some contributions to [jupyterlab-git](https://github.com/jupyterlab/jupyterlab-git).
      - Matthias is a member of the Jupyter security team, which handles [security vulnerability reports and fixes](https://blog.jupyter.org/cve-2021-32797-and-cve-2021-32798-remote-code-execution-in-jupyterlab-and-jupyter-notebook-a70fae0d3239).
      - [Monthly community calls](https://labs.quansight.org/blog/2021/10/jupyter-community-calls/).
      - [Weekly triage meetings](https://docs.jupyter.org/en/latest/community/content-community.html#jupyter-community-meetings).
      - [Fortnightly JupyterLab accessibility meetings](https://github.com/jupyter/accessibility/tree/master/docs/community/meeting-minutes/jupyterlab-accessibility-meetings).
      - [Jupyter accessibility workshops](https://www.youtube.com/playlist?list=PLUrHeD2K9CmkoRVi5tgQdTxJrh6G_IPRD).
      - The above mentioned community and accessibility work is supported by [2 CZI EOSS grants](https://blog.jupyter.org/czi-awards-three-eoss-grants-to-jupyter-community-members-6aef43bd9468), awarded to Jupyter and [Quansight](https://labs.quansight.org/blog/2021/08/czi-eoss4-grants-at-quansight-labs/), and administered by Quansight employees:

