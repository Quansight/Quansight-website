  - title: conda
    image: /images/page-assets/conda-symbol.svg
    imageAlt: Conda Logo
    link: https://github.com/conda/conda
    linkText: Go to the project’s page
    shortDescription: We brought conda and mamba together for the community by integrating the mamba solver
      into the conda project. Providing much needed community needs, namely, faster solving times and
      reduced memory consumption. This is especially true for environments so complex that conda wasn't
      able to handle them anymore.
    longDescription: |-
      ### Contributions to the Project

      - Several Quansight employees contributed to the foundation of the Conda community (parallel but inspired by conda-forge).
      - Quansight was contracted to lead the integrations of the `mamba` solver into `conda`.
      - Anaconda chose Quansight to explore and implement a prototype architecture for the `conda` plugins system.
      - Additional tooling that Quansight employees have created or contributed to:

      ### Quansight Contributors

      - [Anthony Scopatz](https://www.github.com/scopatz) core member and one of the main pillars of the organization for a number of years
      - [Chris Ostrouchov](https://github.com/costrouc) maintains `conda-store`, a tool for building, managing and serving conda environments
      - [Dharhas Pothina](https://www.github.com/dharhas) community member since inception, led efforts to improve geospatial packaging
      - [Filipe Laíns](https://www.github.com/FFY00) designed the architecture for the `conda` plugin system
      - [Gonzalo Peña-Castellanos](https://github.com/goanpeca), community member since its inception, authored Anaconda Navigator and `conda-incubator/setup-miniconda`, used daily by thousands of projects to deploy `conda` in their Github Actions CI pipelines
      - [Ilan Schnell](https://github.com/ilanschnell) was one of the authors of `conda`, `conda-build`, `constructor` and other tools in the ecosystem in the early days of Anaconda
      - [Jaime Rodríguez-Guerra](https://www.github.com/jaimergp) authored the `mamba` integrations for `conda` and modernized the `constructor` stack
