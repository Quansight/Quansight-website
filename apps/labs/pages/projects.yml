  - title: Zarr
    image: /images/page-assets/zarr-icon.svg
    imageAlt: Zarr logo
    link: https://github.com/zarr-developers/zarr-python
    linkText: Go to the project’s page
    shortDescription: Zarr has implementations across several programming languages and is used in multiple
      research fields. With so many stakeholders, there is still an ongoing conversation about version
      3 of the Zarr spec. Despite the possibility of future revisions, we have implemented the current
      draft Zarr v3 spec for Zarr-Python in order to advance community discussions, and to begin testing
      with downstream Python projects such as Dask, Xarray and Napari.
    longDescription: |-
      - Matthias Bussonier and Greg Lee worked on implementation of the [Zarr version 3 specification in zarr-python](https://zarr-specs.readthedocs.io/en/core-protocol-v3.0-dev/protocol/core/v3.0.html).
      - Matthias Bussonier was involved in a number of other general maintenance PRs. He also updated the CI tests in some of downstream projects like Napari, Xarray, and Dask so that their test suites runs against a development branch of Zarr. This will help Zarr-Python avoid potentially breaking these projects when adding new features.
      - Greg Lee made a number of [improvements to the zarr_implementations repository](https://github.com/zarr-developers/zarr_implementations/) which runs tests on implementations of the Zarr spec from multiple programming languages. For example, there are Python, C++, Java, Rust, and Javascript implementations of the Zarr spec. This repository now runs basic tests such as writing a simple Zarr array with each library and then reading it back in with a different library. This already helped resolve some bugs across projects. Test cases were updated to add testing of version 3 spec where implemented and to test with both flat and nested file storage formats.
