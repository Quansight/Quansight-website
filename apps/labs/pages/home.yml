  imageAlt: An illustration of a standing person with a turban.
  leftColumn: |-
    ## Vision

    A world where open source is universally accessible, sustainable, and a thriving engine for global innovation and discovery.
  rightColumn: |-
    ## Mission

    Our mission is to forge resilient partnerships between all types of organizations and open source communities. We aim to deliver engineering expertise and high-value solutions to our customers while practicing sustainable stewardship to ensure the open source ecosystems we all depend on are healthy, resilient, and accessible.
  final: |-
    ## Model

    We created and continue to refine an innovative hybrid employment model. We give open source maintainers a significant amount of time to work on community-driven open source projects, while also spending part of their time on consulting work. Benefits of this model include learning opportunities for our team, bringing back concrete needs and ideas to open source projects, and the flexibility to scale up our contributions to the open source projects we support quickly when we receive direct financial support for them.

    We recognize that successful software projects require many skills and activities beyond software development: community building, technical writing, graphical design, UI/UX design, marketing, fundraising, and more. Most community-driven open source projects lack these skills. We employ writers, designers, community managers, and others with an interest in open source with the aim of growing the diversity of skills present in open source communities, and making projects more healthy and mature.
