  html: "<p></p><p><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading wp-block-heading\">Introduction</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>These Website Standard Terms and Conditions written on this webpage shall manage your use of our website, Quansight.com accessible at <a href=\"https://quansight.com/www.quansight.com\" rel=\"noopener\" target=\"_blank\">https://www.quansight.com</a>.</p><p>These Terms will be applied fully and affect to your use of this Website. By using this Website, you agreed to accept all terms and conditions written in here. You must not use this Website if you disagree with any of these Website Standard Terms and Conditions.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Intellectual Property Rights</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>Other than the content you own, under these Terms,</p><p>Quansight and/or its licensors own all the intellectual property rights and materials contained in this Website.</p><p>You are granted limited license only for purposes of viewing the material contained on this Website.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Restrictions</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>You are specifically restricted from all of the following:</p><ul><li><p>publishing any Website material in any other media;</p></li><li><p>selling, sublicensing and/or otherwise commercializing any Website material;</p></li><li><p>publicly performing and/or showing any Website material;</p></li><li><p>using this Website in any way that is or may be damaging to this Website;</p></li><li><p>using this Website in any way that impacts user access to this Website;</p></li><li><p>using this Website contrary to applicable laws and regulations, or in any way may cause harm to the Website, or to any person or business entity;</p></li><li><p>engaging in any data mining, data harvesting, data extracting or any other similar activity in relation to this Website;</p></li><li><p>using this Website to engage in any advertising or marketing.</p></li></ul><p>Certain areas of this Website are restricted from being access by you and Quansight may further restrict access by you to any areas of this Website, at any time, in absolute discretion. Any user ID and password you may have for this Website are confidential and you must maintain confidentiality as well.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">No Warranties</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>This Website is provided “as is,” with all faults, and Quansight express no representations or warranties, of any kind related to this Website or the materials contained on this Website. Also, nothing contained on this Website shall be interpreted as advising you.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Limitation of Liability</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>In no event shall Quansight, nor any of its officers, directors and employees, shall be held liable for anything arising out of or in any way connected with your use of this Website whether such liability is under contract. Quansight, including its officers, directors and employees shall not be held liable for any indirect, consequential or special liability arising out of or in any way related to your use of this Website.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Indemnification</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>You hereby indemnify to the fullest extent Quansight from and</p><p>against any and/or all liabilities, costs, demands, causes of action, damages and expenses arising in any way related to your breach of any of the provisions of these Terms.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Severability</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>If any provision of these Terms is found to be invalid under any applicable law, such provisions shall be deleted without affecting the remaining provisions herein.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Variation of Terms</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>Quansight is permitted to revise these Terms at any time as it sees fit, and by using this</p><p>Website you are expected to review these Terms on a regular basis.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Assignment</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>The Quansight is allowed to assign, transfer, and subcontract its rights and/or obligations under these Terms without any notification. However, you are not allowed to assign, transfer, or subcontract any of your rights and/or obligations under these Terms.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Entire Agreement</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>These Terms constitute the entire agreement between Quansight and you in relation to your use of this Website, and supersede all prior agreements and understandings.</p></div></section><section class=\"px-[1.8rem] mb-[4.1rem] last:mb-0 xl:px-[4.4rem]\"><h3 class=\"mb-[1.8rem] text-[2.7rem] font-extrabold leading-[3.5rem] text-black sm:mb-[2.2rem] sm:text-[3.2rem] xl:mb-[2.5rem] xl:leading-[5.3rem] font-heading\">Governing Law &amp; Jurisdiction</h3><div class=\"min-w-full text-[1.6rem] text-black marker:text-black prose sm:text-[1.8rem] xl:leading-[2.7rem]\"><p>These Terms will be governed by and interpreted in accordance with the laws of the State of Texas, and you submit to the non-exclusive jurisdiction of the state and federal courts located in Texas for the resolution of any disputes.</p></div></section></p><p></p>"
