            description: "- Robust, reproducible environments using proper package managers (conda, Nix, etc)\n- Pre-configured for AI workflows like model fine-tuning and optimized inference\n- Sustainable foundations to avoid Python packaging issues"
            align: "start"
            divider: true
            descriptionSizePx: 18
            descriptionColor: "#252525"
            descriptionLineHeight: "1.5em"
          - title: "2.  AI Workflow Orchestration"
