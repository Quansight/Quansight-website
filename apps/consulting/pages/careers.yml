      - type: columns
        columns:
          - - type: columns
              columns:
                - - type: text
                    html: "<p>Quansight is an open source consulting firm that operates on a fully remote basis with team members spread across the globe. We cast a wide net to cover many locations, lifestyles, and backgrounds.</p><p>You’ll never be just an employee. You’ll always be you, with all your talent and potential and the opportunity to support our global community.</p><p>Skills and experience are good indicators of a person’s ability but we believe that attitude and drive are the key determinants of success. Given those, the rest will follow. We are looking for people who know how to learn, collaborate, and take action. We have positions within the growing ranks of Quansight and we’re always on the hunt for top talent. </p><p>Whether you are looking for your first position or you are a seasoned professional ready to advance the state of the art, Quansight has the roles, mentors, and peers to help you realize your career goals.</p>"
                    sizePx: 16
                    color: "#000000"
                    paddingRight: "50px"
