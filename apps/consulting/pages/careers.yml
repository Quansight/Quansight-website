- type: columns
  columns:
    - - type: heading
        text: "Camp Quansight 2025: Monte Real, Portugal"
        level: 4
        sizePx: 40
        fontWeight: 900
        color: "#452392"
        align: "center"
        paddingRight: "30px"
      - type: text
        html: "<p dir=\"auto\" style=\"text-align: left;\">Camp Quansight is our annual company retreat! This year, our team met in Portugal for a week of collaboration, reflection, and inspiration.</p><p dir=\"auto\" style=\"text-align: left;\">As part of our ongoing commitment to fostering innovation and community within open source, Camp Quansight provides space to connect across teams, align on our shared vision, and celebrate the people who make our mission possible.</p><p dir=\"auto\" style=\"text-align: left;\">This year’s retreat featured a balance of strategic discussions, team-building activities, and moments to explore Portugal’s rich culture, from surfing in Nazaré to touring the historic Batalha Monastery.</p><p dir=\"auto\" style=\"text-align: left;\">Watch the video for highlights from this unforgettable week and a glimpse into what makes Quansight’s culture and purpose so unique!</p>"
        sizePx: 16
        color: "#000000"
        paddingRight: "50px"
      - type: video
        url: "https://youtu.be/ItsP5l9M-Os?si=ypyocx2gzhWhC2vR"
  paddingTop: "50px"
