        paddingTop: "25px"
      - type: columns
        columns:
          - - type: columns
              columns:
                - - type: text
                    html: "<h1><b>Approach to Hiring</b></h1><p>It is our purpose to deliver a great candidate experience for everyone applying for a position at Quansight. We embrace diversity and invite applications from individuals of all backgrounds, as well as make use of different recruitment channels to attract the best talent to our organization. If you have a disability, please let us know if there is anything we can do to make your interview process better, we’re happy to accommodate.\t\t\t\t\t\t\t\t</p>"
                    sizePx: 16
