                - - type: text
                    html: "<h1><b>Perks &amp; Benefits</b></h1><ul><li>Fully Distributed Working Environment</li><li>30 Days of Vacation/Holiday Leave Annually (inclusive of national holidays)</li><li>10 Days of Sick Leave Annually</li><li>$2,000 Hardware &amp; Home Office Budget</li><li>$250/year Personal Development Budget</li><li>Generous Paid Parental Leave</li><li>In Person Company Retreats / Virtual Gatherings</li><li>Conference Budget</li></ul>"
                    sizePx: 16
                    color: "#000000"
                    paddingLeft: "50px"
              columnWidths:
