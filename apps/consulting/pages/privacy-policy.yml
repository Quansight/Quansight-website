- type: text
  html: "<p>Third-Party Tools</p>"
- type: text
  html: "<p>Some content and/or applications on the Website may be provided through integration with third parties and use of their tools and/or services. We do not control these third parties. Third-party tools and services are subject to their own respective privacy policies and they may collect additional information about You when You use their services integrated into Our Website and Services. Please review any corresponding privacy policies to the tools and services listed below, as We disclaim any responsibility for their information collection practices.</p><p>We use the following tools as part of the platform for delivering the Website to you. Each of these tools may have its own privacy policy. We use WordPress as the core platform for creating and delivering the Website. We use Plausible Analytics to collect privacy-preserving statistics on visitors to the Website. All other tools mentioned here are plugins to the WordPress platform.</p>"
