  columns:
    - - type: heading
        text: "Client Testimonials"
        level: 4
        sizePx: 50
        fontWeight: 900
        color: "#452392"
        align: "center"
        lineHeight: "1.2em"
      - type: testimonial-carousel
        items:
          - text: "“A colleague from the Pangeo community opened up the sky for us when they recommended Quansight do the hard work of updating Pandas so it could allow non-nanosecond time resolution, which is crucial to our field (paleoclimatology). We were pleasantly surprised when the reviews of our proposal to the National Science Foundation expressed great support for this collaboration, which helped get the project funded.”  , USC"
            name: "Julien Emile-Geay"
            title: "Professor of Climate Science, USC"
            image: "/page-assets/home/USC-2.png"
            imageAlt: "Julien Emile-Geay"
          - text: "\"Quansight was amazing to work with. They helped us select and implement an open source technology stack that enabled us to cost-effectively process terabytes of data per day. Not only that, but they automated the deployment process, untethering us from specific cloud vendors, and enabling us to shop for competitive rates.\""
            name: "Brian Larsen"
            title: "Director of Technical Product, Datum"
            image: "/page-assets/home/Datum.png"
            imageAlt: "Brian Larsen"
          - text: "\"We engaged Quansight with some Jupyter, Python team development, data visualization skills in hand. Quansight helped us refine these skills by offering guidance in establishing our best practices, but more important to our long term analytical success, they helped us build a strategy around the use and deployment of these tools.\""
            name: "Executive"
            title: "US-Based Systematic Hedge Fund & Commodity Trading Advisor"
            image: "/page-assets/home/Avatar.png"
            imageAlt: "Executive"
