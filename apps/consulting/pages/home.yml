    - - type: columns
        columns:
          - - type: text
              html: "<p data-end=\"683\" data-start=\"494\">Organizations rely on open source software to innovate, but many struggle to engage sustainably with the communities behind the projects they depend on. Quansight exists to bridge that gap.</p><p data-end=\"1098\" data-start=\"685\">Our team of software developers, community leaders, technical writers, and designers actively maintain and contribute to more than 40 open source projects, including <strong data-end=\"914\" data-start=\"851\">CPython, NumPy, Jupyter, conda-forge, Polars, and stdlib.js</strong>. We partner with engineering, product, and research teams to solve complex technical challenges, accelerate development, reduce risk, and unlock new value across the PyData ecosystem.</p><p data-end=\"1403\" data-start=\"1100\">At the same time, we ensure that this work strengthens the health, resilience, and long-term sustainability of the open source projects and communities our customers rely on. We believe commercial success and community sustainability should reinforce each other — and we help organizations achieve both.</p>"
              sizePx: 16
              color: "#000000"
              lineHeight: "2em"
              paddingRight: "50px"
