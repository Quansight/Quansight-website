      - type: columns
        columns:
          - - type: text
              html: "<h2 style=\"text-align: left;\"><b>1. Deep Technical Expertise</b></h2><p>Our team includes maintainers, core contributors, and long-time practitioners across the PyData and broader open source ecosystem. This deep OSS experience means we don’t just build solutions, we follow established development, packaging, and security best practices from the start, reducing risk and ensuring long-term maintainability.</p>"
              sizePx: 15
              paddingRight: "4px"
              borderWidth: "0px 2px 0px 0px"
              borderColor: "#CFC8DF"
          - - type: text
              html: "<h2 style=\"text-align: left;\"><b>2. A Complete Consulting Model</b></h2><p><span style=\"font-weight: 400;\">Our consulting approach considers the full context of how software is built, used, and sustained, spanning user experience (UX), developer experience (DevEx), documentation, accessibility, and community impact. Especially in our open source services, we design solutions that are usable, adoptable, and aligned with real-world workflows.</span></p>"
              sizePx: 15
              paddingRight: "7px"
              borderWidth: "0px 2px 0px 0px"
              borderColor: "#CFC8DF"
              borderRadius: "0px 2px 0px 0px"
          - - type: text
              html: "<h2 style=\"text-align: left;\"><b>3. Ecosystem Impact</b></h2><p><span style=\"font-weight: 400;\">We actively contribute upstream to open source projects when it makes sense, strengthening the tools and ecosystems our clients rely on. Beyond direct contributions, we reinvest our success into the community through our open source internship program, OSS funding initiatives, and sustained project maintenance, helping ensure long-term ecosystem health.</span></p>"
              sizePx: 15
              paddingRight: "2px"
