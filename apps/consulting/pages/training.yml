- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/polars_logo_icon_248809-100x100.png"
        alt: "A transparent, black and white Polars logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Polars"
            description: "Polars is a Rust-written DataFrame library that enables high-speed data processing. This training offers hands-on experience in optimizing data analysis through intuitive APIs, parallel processing, and handling large datasets efficiently, which is ideal for professionals eager to master advanced data science techniques."
    - - type: image
        src: "/page-assets/training/dask-150x150.webp"
        alt: "Image of the Dask logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Dask"
            description: "Introduces Dask for scaling data analysis in Python. This workshop comprises initial explorations of the technical limits of NumPy and Pandas, the fundamentals of parallel computing in Python, using Dask arrays and dataframes in practice, and introduces machine learning with Dask."
- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/RAPIDS-logo-purple-300x110.png"
        alt: "Image of the Rapids logo"
        width: 200
        height: 73
      - type: icon-box-grid
        items:
          - title: "RAPIDS"
            description: "Introduces the open source Python RAPIDS libraries for accelerating computation with GPUs (graphics processing units). Participants practice using the RAPIDS libraries for common ETL and machine learning workloads without having to program with low-level languages (e.g., C/C++)."
    - - type: image
        src: "/page-assets/training/logo-300x136.png"
        alt: "Image of the Open CV logo"
        width: 200
        height: 91
      - type: icon-box-grid
        items:
          - title: "Computer Vision"
            description: "Prepares practitioners to tackle the automated analysis and interpretation of images with practical computer vision systems. This includes the rudiments of computer vision theory and methods (e.g., feature extraction, object recognition, registration, segmentation)."
- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/xarray-logo-square-150x150.webp"
        alt: "Image of the xarray logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Xarray"
            description: "Introduces participants to the Xarray project for manipulating multi-channel data (e.g., as it occurs commonly in geosciences, etc.). Participants practice using Xarray for data analysis extending techniques from Pandas and NumPy to high-dimensional labeled arrays."
    - - type: image
        src: "/page-assets/training/dask-150x150.webp"
        alt: "Image of the Dask logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Dask-ML"
            description: "Introduces participants to Dask-ML for scaling standard Python machine learning tools (e.g., scikit-learn, XGBoost). Participants apply various pre-built models on moderate-to-large datasets to learn best practices for parallel and out-of-core machine learning."
- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/pytorch-logo-150x150.webp"
        alt: "Image of the PyTorch logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Deep Learning"
            description: "Introduces participants to the foundations of deep learning. Participants practice constructing neural networks of various levels of complexity to connect the core ideas to their realization in practical applications (e.g., image processing, natural language processing)."
    - - type: image
        src: "/page-assets/training/holoviz-150x150.webp"
        alt: "Image of the HoloViz logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Visualization"
            description: "Builds techniques for web-based data exploration and interactive-app development in Python using open source Holoviz libraries (e.g., HoloViews, HvPlot, Datashader, and Panel). These tools enable constructing rich, high-performance, scalable, flexible, and deployable visualizations easily."
- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/numba-favicon-150x150.webp"
        alt: "Image of the Numba logo"
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Numba"
            description: "Introduces participants to Numba, a tool for Just-in-Time compilation of Python code. Participants practice profiling sample application codes and accelerating them with Numba."
    - - type: image
        src: "/page-assets/training/intake-150x150.webp"
        alt: ""
        width: 100
        height: 100
      - type: icon-box-grid
        items:
          - title: "Intake"
            description: "Overviews Intake, a lightweight package for finding, investigating, loading, and disseminating data. Participants will learn the fundamentals of using Intake to deploy data as would be required in applied industrial settings under various constraints (e.g., hardware, security)."
- type: columns
  columns:
    - - type: image
        src: "/page-assets/training/pangeo_simple_logo.svg"
        alt: "Image of the Pangeo logo"
        width: 200
        height: 200
      - type: icon-box-grid
        items:
          - title: "Pangeo"
            description: "Introduces Pangeo as a community platform for Big Data geoscience. Participants will experiment with large geophysical datasets and tools like Dask & Xarray to familiarize themselves with the Pangeo stack."
    - - type: image
        src: "/page-assets/training/python-logo-master-v3-TM-flattened-300x101.png"
        alt: "Image of the Python logo"
        width: 200
        height: 67
      - type: icon-box-grid
        items:
          - title: "Advanced Python"
            description: "Provides a deep-dive into internal features of the Python programming language as related to asynchronous computation, concurrency, efficiency, functional programming, and object-oriented design."
