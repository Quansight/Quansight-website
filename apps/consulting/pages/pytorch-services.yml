- type: heading
  text: "Frequently Asked Questions"
  level: 4
  sizePx: 47
  color: "#452392"
- type: toggle
  items:
    - title: "Our company is new to PyTorch, can Quansight still help me?"
      content: "<p><span style=\"font-weight: 400;\">Yes! We are well versed in assisting companies at any stage along the PyTorch journey, including those who are just getting started.</span></p>"
- type: toggle
  items:
    - title: "We have a number of PyTorch engineers on staff and have a good system going but need expert help from time to time. Is that something Quansight can offer?"
      content: "<p><span style=\"font-weight: 400;\">Absolutely. Our experts have built many of the internal PyTorch systems and have insight that can help even the most advanced users get more out of their systems. </span></p>"
- type: toggle
  items:
    - title: "What do the monthly office hours entail?"
      content: "<p><span style=\"font-weight: 400;\">Your team will have a time window with exclusive access to an expert. You can use this time to learn about PyTorch, get advice on how to design your systems, or discuss anything else you like. </span></p>"
- type: toggle
  items:
    - title: "What sort of services do you offer around Large Language Models (LLMs)?"
      content: "<p><span style=\"font-weight: 400;\">Thanks to our expertise in LLMs, AI/ML, cloud infrastructure, and the broader scientific, visualization, and data platform Python stack, we can support you at any stage in building an LLM strategy—from getting started to refining what’s in place. See our <span style=\"text-decoration: underline; color: #a43a8f;\"><a href=\"/llm-services\" style=\"color: #a43a8f; text-decoration: underline;\">LLM Services page</a></span> to learn more. </span></p>"
- type: toggle
  items:
    - title: "What is a PyTorch Masterclass?"
      content: "<p><span style=\"font-weight: 400;\">The best way to get started from scratch is to learn from the people who built the platform! Learn the various components of PyTorch and domain libraries from the maintainers who are working on them every day. </span></p>"
- type: toggle
  items:
    - title: "Are the support tickets via GitHub?"
      content: "<p><span style=\"font-weight: 400;\">We can easily adapt to whatever systems you are comfortable with. We can use GitHub issues on the PyTorch repository, private issues on your own ticketing system, or any other medium to track support tickets.  </span></p>"
- type: heading
  text: "About Quansight"
  level: 2
  sizePx: 47
  color: "#452392"
- type: text
  html: "<p><span style=\"font-weight: 400;\">Quansight is a data, science, and engineering firm that specializes in solving complex, data-related problems by leveraging the open source software at the foundation of machine learning and artificial intelligence. </span></p><p> </p><p><span style=\"font-weight: 400;\">Our knowledge in scientific Python and its ecosystem of libraries and tools allows us to offer bespoke solutions that derive true value from data. We empower clients with critical business insights and actionable knowledge while strengthening the open source projects modern technologies depend on.</span></p>"
