- type: heading
  text: "Our Story"
  level: 4
  sizePx: 47
  color: "#452392"
- type: columns
  columns:
    - - type: text
        html: "<p>Quansight was founded by Travis Oliphant, a well-known leader in the Python Data community. Travis has authored or led the creation of industry cornerstones such as NumPy, SciPy, Numba, and Conda, and helped establish NumFOCUS and the PyData conference series. He founded Anaconda and established the industry-standard platform for data science and machine learning. With Quansight, Travis has leveraged decades of relationships in the open source community to assemble some of the top talent in the industry.</p>"
    - - type: image
        src: "/page-assets/about-us/our-leadership-in-pydata-1.svg"
        alt: ""
        width: 800
        height: 430
- type: columns
  columns:
    - - type: image
        src: "/page-assets/about-us/about-us_-world-map-1.svg"
        alt: ""
        width: 800
        height: 602
    - - type: text
        html: "<p>More than half of our full-time technical staff are active contributors to open source data projects. Many of them have leadership roles in those communities. Quansight is one of the largest contributors to the PyTorch project. One result of Quansight seeking to employ industry experts is that we are very diverse geographically. Another result is that we are diverse with staff in many continents, countries, cultures, and creeds. The Quansight team is dedicated to helping organizations succeed with open source software. It’s our passion.</p>"
