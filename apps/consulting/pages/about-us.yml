- type: columns
  columns:
    - - type: heading
        text: "Our Values"
        level: 4
        sizePx: 47
        color: "#ffffff"
      - type: columns
        columns:
          - - type: image
              src: "/page-assets/about-us/Transparency-100x100.png"
              alt: ""
              width: 100
              height: 100
            - type: heading
              text: "TRANSPARENT"
              level: 6
              sizePx: 25
              color: "#ffffff"
            - type: text
              html: "<p><span style=\"font-weight: 400;\">We strive for open and transparent principles across the board, from how we contribute to open source projects to how we manage our company. We believe that transparency builds trust, fosters accountability, and creates a stronger foundation for collaboration.</span></p>"
          - - type: image
              src: "/page-assets/about-us/Empathy-100x100.png"
              alt: ""
              width: 100
              height: 100
            - type: heading
              text: "EMPATHETIC"
              level: 6
              sizePx: 25
              color: "#ffffff"
            - type: text
              html: "<p><span style=\"font-weight: 400;\">We start by seeking to understand. We listen actively to our colleagues, our community, and our users, considering their perspectives and contexts in all our decisions.</span></p>"
          - - type: image
              src: "/page-assets/about-us/Inclusive-100x100.png"
              alt: ""
              width: 100
              height: 100
            - type: heading
              text: "INCLUSIVE"
              level: 6
              sizePx: 25
              color: "#ffffff"
            - type: text
              html: "<p><span style=\"font-weight: 400;\">We actively seek and welcome diverse perspectives. We believe that innovation flourishes in an environment where people from all backgrounds feel they belong and are empowered to contribute to their fullest potential.</span></p>"
          - - type: image
              src: "/page-assets/about-us/Accountability-100x100.png"
              alt: ""
              width: 100
              height: 100
            - type: heading
              text: "ACCOUNTABLE"
              level: 6
              sizePx: 25
              color: "#ffffff"
            - type: text
              html: "<p><span style=\"font-weight: 400;\">We trust our team members to make decisions and take ownership. We give people the autonomy to do their best work and hold ourselves accountable for the outcomes.</span></p>"
  columnBackgrounds:
    - "#452393"
