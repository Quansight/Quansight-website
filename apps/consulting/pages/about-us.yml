      - type: columns
        columns:
          - - type: columns
              columns:
                - - type: text
                    html: "<p>Quansight was founded by Travis Oliphant, a well-known leader in the Python Data community. Travis has authored or led the creation of industry cornerstones such as NumPy, SciPy, Numba, and Conda, and helped establish NumFOCUS and the PyData conference series. He founded Anaconda and established the industry-standard platform for data science and machine learning. With Quansight, Travis has leveraged decades of relationships in the open source community to assemble some of the top talent in the industry.</p>"
                    sizePx: 16
                    color: "#000000"
                    paddingRight: "50px"
                - - type: image
                    src: "/page-assets/about-us/our-leadership-in-pydata-1.svg"
                    alt: ""
                    width: 800
                    height: 430
              columnWidths:
                - 50
