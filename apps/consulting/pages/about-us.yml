        paddingTop: "25px"
      - type: columns
        columns:
          - - type: columns
              columns:
                - - type: image
                    src: "/page-assets/about-us/about-us_-world-map-1.svg"
                    alt: ""
                    width: 800
                    height: 602
                - - type: text
                    html: "<p>More than half of our full-time technical staff are active contributors to open source data projects. Many of them have leadership roles in those communities. Quansight is one of the largest contributors to the PyTorch project. One result of Quansight seeking to employ industry experts is that we are very diverse geographically. Another result is that we are diverse with staff in many continents, countries, cultures, and creeds. The Quansight team is dedicated to helping organizations succeed with open source software. It’s our passion.</p>"
                    sizePx: 16
                    color: "#000000"
                    paddingLeft: "50px"
