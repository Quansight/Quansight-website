                - - type: text
                    html: "<p>Some open source software takes the form of a focused set of functions, like numerical calculations or methods for creating charts from data, which can be used by other developers to create new software. These libraries can be thought of as reusable components for building new software. Other open source software projects are fully self-contained applications like web-servers, databases, photo editors, etc. There are millions of open source libraries now and nearly every piece of commercial software has its open source equivalent.</p><p>Open source software is managed as “projects” that are focused on creating a particular piece of software that is distributed as a “library” or application. Some projects are staffed by volunteers who are collectively referred to as the “community” for that project. The developers working on a project are called “contributors” to the project. We call this model, Community-driven open-source software [CDOSS]. Sometimes a project is driven by a company that has a need for the software but does not feel it needs exclusive access to the software. In that case some of the developers working on the project are paid employees of that company. Typically other interested developers are allowed to contribute to the effort on a voluntary basis. We call this model company-backed open source software [CBOSS].</p>"
                    sizePx: 16
                    color: "#000000"
                    paddingLeft: "50px"
              columnWidths:
