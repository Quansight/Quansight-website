      - type: columns
        columns:
          - - type: columns
              columns:
                - - type: text
                    html: "<p>Open source software is licensed free of charge. Which is pretty amazing. And which begs the question: why do these individuals and companies pour billions of dollars worth of development into software and then give it away for free? There are many different reasons. Some volunteers find it rewarding to create great software, period. They seek the freedom to create what they are passionate about. Some want to see their software used by as many people as possible and don’t think it should be used to profit a single organization. Some companies don’t need to have exclusive access to the software they create and want to establish an industry standard or believe that the result will be better if many developers contribute their talents. And there are many more reasons.</p>"
                    sizePx: 16
                    color: "#000000"
                    paddingRight: "50px"
