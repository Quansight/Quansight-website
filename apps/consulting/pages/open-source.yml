- type: text
  html: "<p><b>At Quansight, we are passionate about the open source software movement and all the great software that has resulted. We see the benefit of the different models for creating open source software and applaud the many different reasons for creating it. We believe that open source is the future of software and are committed to helping create a robust, sustainable open source software economy.</b></p>"
  sizePx: 16
