                - - type: text
                    html: "<p>Over the last 30 years, the open source software movement has grown from the ideas of a few influential programmers to become the way that the majority of software is developed today. A simple description of open source software is computer software that is released under a license that allows use, study, modification, and distribution of the original software and its source code by anyone for any purpose. The reality gets a little more complicated with differing license models, but generally that’s it. Developers write software and let others use, modify, and distribute it as they like.</p>"
