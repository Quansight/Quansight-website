            - type: text
              html: "<p><a href=\"https://jupyter.org/try-jupyter/lab/index.html\">The JupyterLite</a> project for running Jupyter in browsers is a major focus area for Quansight Labs.</p>"
              sizePx: 18
              color: "#000000"
          - - type: text
              html: "<p>Our team members are leading the effort to add interactivity and executable code blocks to documentation websites across the Scientific Python ecosystem using JupyterLite. This involves contributing to JupyterLite and developing extensions.</p>"
              sizePx: 18
              color: "#000000"
            - type: text
