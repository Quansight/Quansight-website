        level: 4
        sizePx: 40
        color: "#452392"
    - - type: text
        html: "<p>Visually exploring data through interactive plots helps you connect more closely to your data, quickly identify patterns and insights, and meaningfully share those insights with others. Quansight’s visualization team is skilled in transforming your data analysis into a compelling story through the use of dashboards. We can build dashboards to illustrate interactive results of analytics to executives, or dashboards to help data scientists and engineers process and analyze data through a common workflow.</p>"
