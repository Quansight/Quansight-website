  text: "Meet Some of Our Experts"
  level: 2
  sizePx: 40
  color: "#452392"
- type: text
  html: "<p>Our technical staff are also contributors and maintainers of core PyData projects, including NumPy, PyTorch, SciPy, Jupyter, Nebari, Napari, Matplotlib, scikit-learn, Dask, conda, and Numba.​</p><p>Check out the <a href=\"https://labs.quansight.org/team\">Quansight Labs Team</a> page to learn more.</p>"
- type: text
  html: "<ul>\n<li><b><b>Tania Allard – </b></b>PSF Board Vice Chair, Jupyter Distinguished Contributor, conda Steering Council</li>\n<li><b><b>Ralf Gommers – </b></b>SciPy/NumPy Maintainer, Array API Standard and Pypackaging-native Creator</li>\n<li><b><b>Travis Oliphant – </b></b>NumPy, SciPy &amp; Numba Creator</li>\n<li><b><b>Athan Reines – </b></b>stdlib Core Developer, Consortium for Python Data API Member</li>\n<li><b><b>Marco Gorelli – </b></b>Polars/Pandas Maintainer, Creator of Narwhals</li>\n<li><b><b>Jaime Rodríguez-Guerra – </b></b>conda-forge Maintainer &amp; Core Team Member, conda Steering Council</li>\n<li><b><b>Melissa Weber Mendonça – </b></b>NumPy Steering Council</li>\n<li><b><b>Nathan Goldbaum – </b></b>NumPy, SciPy, Napari Maintainer, Senior Developer</li>\n<li><b><b>Matti Picus – </b></b>NumPy, PyPy, Manylinux Maintainer</li>\n<li><b><b>Neil Schemenauer – </b></b>CPython Core Developer, Author of CPython’s Garbage Collector</li>\n</ul>"
