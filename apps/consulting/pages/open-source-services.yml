- type: text
  html: "<p>More than 90% of technology is built using open source software, and with the rise of artificial intelligence (AI) and large language models (LLMs), these dependencies are only growing. Establishing a robust open source strategy is essential for modern organizations looking to build a long-term plan for sustainability and innovation. However, organizational leaders often need help knowing where to start.</p><p>At Quansight, we bridge the gap between businesses and the open source community by leveraging our long-standing position and reputation within the community to facilitate trust-building. By aligning our community expertise with your business goals and needs, we’ll develop an open source strategy that works for you.</p>"
