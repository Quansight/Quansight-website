- type: heading
  text: "FAQ"
  level: 2
  sizePx: 40
  color: "#452392"
- type: toggle
  items:
    - title: "I already have a strategy that needs to be properly assessed, can you help?"
      content: "<p><span style=\"font-weight: 400;\">Yes, absolutely. At Quansight, we specialize in helping organizations assess and refine their open source strategies. Our experts will thoroughly evaluate what’s in place, identify areas for improvement, and provide tailored recommendations to ensure they align with industry best practices, the community, and your specific goals.</span></p>"
    - title: "Can Quansight help my organization understand the business value and potential risks associated with open source adoption?"
      content: "<p><span style=\"font-weight: 400;\">Definitely. We understand that adopting open source technologies comes with both opportunities and potential risks. Our team will work closely with you to help your organization fully comprehend the business value that open source can provide and identify and mitigate any associated risks or compliance issues. </span></p>"
    - title: "What types of support does Quansight provide for navigating licensing and compliance issues?"
      content: "<p><span style=\"font-weight: 400;\">Licensing and compliance are critical aspects of open source adoption. Quansight offers comprehensive support in this area, including license analysis, policy development, and training to ensure your organization complies with various open source licenses.</span></p>"
    - title: "How does Quansight facilitate collaboration and trust-building within open source communities?"
      content: "<p><span style=\"font-weight: 400;\">Quansight has a long-standing reputation and deep connections within many open source communities. We leverage this position to facilitate collaboration and trust-building between your organization and these communities. Our team can guide you through the process of contributing to open source projects, fostering relationships with key stakeholders, and establishing your organization as a trusted and valued member of the community.</span></p>"
    - title: "Can Quansight help my organization identify and prioritize critical dependencies?"
      content: "<p><span style=\"font-weight: 400;\">Yes. Identifying and prioritizing critical open source dependencies is a crucial part of our services. We’ll thoroughly assess your technology stack, pinpoint the most critical dependencies, and help you develop strategies to manage and mitigate associated risks. This includes exploring alternative solutions, contributing to projects, or implementing contingency plans.</span></p>"
    - title: "What steps does Quansight take to ensure our open source strategy aligns with our organization's long-term goals and objectives?"
      content: "<p><span style=\"font-weight: 400;\">We take a holistic approach to developing open source strategies. We start by gaining a deep understanding of your organization’s long-term goals, objectives, and unique needs. From there, we work closely with your team to craft a tailored strategy that not only leverages the power of open source but also directly supports and aligns with your broader organizational objectives.</span></p>"
    - title: "How does Quansight assist in measuring the effectiveness and impact of our open source initiatives?"
      content: "<p><span style=\"font-weight: 400;\">Measuring the success of your open source initiatives is crucial for continuous improvement and demonstrating value to stakeholders. Quansight can help you establish key performance indicators (KPIs) and metrics tailored to your goals. We’ll then provide guidance on tracking and analyzing these metrics, enabling you to quantify the impact of your initiatives and make data-driven decisions moving forward.</span></p>"
    - title: "What resources and training programs does Quansight offer to support our team in becoming more proficient in open source development and management?"
      content: "<p><span style=\"font-weight: 400;\"> Quansight provides a range of resources and training programs to help your team develop the necessary skills for efficient open source development and management. This includes hands-on workshops, online courses, mentorship programs, and access to our extensive knowledge base. Our goal is to empower your team with the expertise needed to successfully navigate the open source landscape and maximize the value it provides.</span></p>"
