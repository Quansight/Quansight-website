              heading: "AI Proof of Concept"
              price: "25,000"
              currency: "$"
            - type: columns
              columns:
                - - type: text
                    html: "<p>This engagement is ideal for companies just beginning to explore AI. It focuses on setting up a proof of concept, allowing you to experiment with AI tools on a small scale and providing initial insights for future AI projects.<br/><br/></p>"
                    sizePx: 18
                  - type: divider
                    color: "#452391"
                    widthPercent: 100
              marginTop: "4%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: price-table
              heading: "AI Starter Project"
              price: "50,000"
              currency: "$"
            - type: columns
              columns:
                - - type: text
                    html: "<p>For businesses ready to dive deeper, this tier explores specific AI use cases aligned with your business objectives. It includes training AI models on your internal data, developing prototype low-code/no-code interfaces, and providing strategic recommendations for scaling AI initiatives.</p>"
                    sizePx: 18
                  - type: divider
                    color: "#452391"
                    widthPercent: 100
              marginTop: "4%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: price-table
              heading: "AI Transformation Project"
              price: "250,000"
              subheading: "(Phase I)"
              currency: "$"
            - type: columns
              columns:
                - - type: text
                    html: "<p>\n\t\t\t\t\t\t\t\t\tDesigned for businesses ready to integrate AI into their core operations, this comprehensive package focuses on building or enhancing your robust R&amp;D platform, developing intelligent AI-workflows or embedding AI capability into your applications, and setting the foundation for ongoing AI transformation.\n\t\t\t\t\t\t\t\t</p>"
                    sizePx: 18
                  - type: divider
                    color: "#452391"
