    - - type: columns
        columns:
          - - type: text
              html: "<p>\n\t\t\t\t\t\t\t\t\tAre you ready to accelerate your AI capabilities and explore how the latest technologies can be incorporated into your business? Are you already using AI but not convinced you’re reaping all of its benefits?\n\t\t\t\t\t\t\t\t</p>"
              sizePx: 21
              fontWeight: 600
              color: "#252525"
            - type: text
              html: "<p>\n\t\t\t\t\t\t\t\t\tAs artificial intelligence continues to shape our world, organizations are eager to understand and utilize its growing potential. However, translating groundbreaking research and technical prototypes into AI solutions that deliver tangible business value remains a considerable challenge.\t\t\t\t\t\t\t\t</p>"
              sizePx: 18
