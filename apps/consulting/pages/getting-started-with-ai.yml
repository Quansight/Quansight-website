                - - type: heading
                    text: "Scalable Infrastructure"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p><span style=\"font-weight: 400;\">Utilize Quansight-incubated open source projects—Nebari and Nebari-Slurm—to optimize resource management, seamlessly integrate with JupyterHub, and unlock the full potential of your AI workloads. This flexible infrastructure empowers you to switch between cloud providers or utilize on-premises hardware with ease.</span></p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: columns
              columns:
                - - type: heading
                    text: "AI Lifecycle Management"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p>\n\t\t\t\t\t\t\t\t\tControl every stage of the AI lifecycle. From data preparation and model pre-training to post-training optimization and deployment, our DevOps support ensures smooth, efficient operations. Build, train, and deploy AI models using your systems or we can deploy Nebari and Nebari-Slurm for your benefit.\t\t\t\t\t\t\t\t</p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: columns
              columns:
                - - type: heading
                    text: "Open Source Advantage"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p>\n\t\t\t\t\t\t\t\t\tWith our long-standing position and reputation within the community, we bridge the gap between businesses and the open source community. By aligning our community expertise with your business needs, we’ll develop an AI transformation strategy unique to you. \n\t\t\t\t\t\t\t\t</p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
