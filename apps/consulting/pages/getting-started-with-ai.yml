- type: columns
  columns:
    - - type: columns
        columns:
          - - type: text
              html: "<p>AI is <a href=\"/blog/generative-ai-made-possible-by-a-mountain-of-open-source\" rel=\"noopener\" target=\"_blank\">built on a foundation of extensive open source innovation</a>. With Quansight’s deep roots in these foundations of scientific computing, we’re uniquely positioned to navigate the complexities of bringing sophisticated AI models from concept to deployment. Our <a href=\"/ai-engineering\">AI engineering</a> solutions offer the necessary infrastructure, sustainable practices, and integration expertise to turn theoretical advancements into impactful, scalable systems across your organization.</p>"
              sizePx: 18
              color: "#252525"
            - type: text
              html: "<p>Whether you’re considering a limited proof of concept (POC) or ready for a full-scale AI transformation, Quansight has the engineers and expertise to make it happen. <strong>With us, you can expect</strong>:</p>"
              sizePx: 18
        paddingTop: "5%"
        paddingBottom: "5%"
  paddingRight: "10%"
  paddingLeft: "10%"
- type: columns
  columns:
    - - type: columns
        columns:
          - - type: columns
              columns:
                - - type: heading
                    text: "Total Control and Customization"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p>Expect full control over your AI deployment. <a href=\"https://www.nebari.dev/\">Nebari</a>, a Quansight-incubated open source project, with expert support, illustrates what is possible. Choose your infrastructure, customize pipelines, and ensure data privacy.</p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: columns
              columns:
                - - type: heading
                    text: "Privacy-Focused AI Innovation"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p>Streamline your AI strategy with open source experts. You can keep your data secure on your systems while leveraging state-of-the-art models like Llama 3.1 (or Mistral)—all without relying on third-party vendors.</p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
          - - type: columns
              columns:
                - - type: heading
                    text: "Comprehensive AI Solutions"
                    level: 3
                    sizePx: 22
                    fontWeight: 700
                    color: "#963895"
                  - type: text
                    html: "<p>\n\t\t\t\t\t\t\t\t\tBuild a complete AI ecosystem alongside Quansight experts with flexible infrastructure like Nebari and expert DevOps support. \n\t\t\t\t\t\t\t\t</p>"
                    sizePx: 18
                  - type: divider
                    color: "#963895"
                    widthPercent: 100
              paddingTop: "10%"
              paddingRight: "10%"
              paddingBottom: "10%"
              paddingLeft: "10%"
