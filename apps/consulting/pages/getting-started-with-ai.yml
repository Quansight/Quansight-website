      - type: heading
        text: "Jupyter AI Expertise"
        level: 2
        sizePx: 40
        fontWeight: 700
        color: "#452392"
        align: "center"
      - type: text
        html: "<p><span style=\"font-weight: 400;\">Quansight’s expertise extends to <a href=\"https://github.com/jupyterlab/jupyter-ai\" rel=\"noopener\" target=\"_blank\">Jupyter AI</a> which brings generative AI directly to <a href=\"/jupyter-technologies\">Jupyter</a> notebooks. With regular contributors to Jupyter AI on our team, we’re equipped to help your organization adopt and leverage its powerful capabilities. It integrates seamlessly with popular LLMs like those from AI21, OpenAI, Anthropic, and others, while ensuring full control over your data privacy. </span></p>"
        sizePx: 18
  marginBottom: "4%"
  paddingRight: "10%"
  paddingLeft: "10%"
- type: columns
  columns:
    - - type: heading
        text: "Meet Some of Our Experts"
        level: 2
        sizePx: 40
        fontWeight: 700
      - type: text
        html: "<p>Our technical staff are also contributors and maintainers of core PyData projects, including NumPy, PyTorch, SciPy, Jupyter, Nebari, Napari, Dask, conda, and Numba.​ </p>"
        sizePx: 18
      - type: text
        html: "<p><a href=\"https://labs.quansight.org/team\" rel=\"noopener\" target=\"_blank\">Check out the Quansight Labs Team page to learn more.</a></p>"
  paddingRight: "10%"
  paddingLeft: "10%"
- type: columns
  columns:
    - - type: columns
        columns:
          - - type: text
              html: "<p><strong>Travis Oliphant</strong>, NumPy, SciPy, and Numba Creator<br/><strong>Tania Allard</strong>, JLab Accessibility project creator, PSF board vice chair, Jupyter Distinguished Contributor<br/><strong>Dharhas Pothina</strong>, Nebari &amp; Conda Store Creator, Holoviz Steering Committee<br/><strong>Ralf Gommers</strong>, SciPy/NumPy Maintainer, Array API Standard Creator, pypackaging-native Author<br/><strong>Pearu Peterson</strong>, SciPy Creator &amp; f2py Author<br/><strong>Andrew James</strong>, PyTorch Core Developer, torch.sparse Author<br/><strong>Isuru Fernando</strong>, Conda-forge Maintainer &amp; Member of Steering Committee<br/><strong>Victor Fomin</strong>, PyTorch Core Developer, PyTorch Ignite Project Lead<br/><strong>Nathan Goldbaum</strong>, Senior NumPy developer<br/><strong>Jaime Rodríguez-Guerra</strong>, Conda-forge Maintainer &amp; Steering Committee Member</p>"
              sizePx: 18
          - - type: image
